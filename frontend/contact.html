<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AI Insights</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>



<body>
    <header>
        <nav>
            <ul class="navbar">
                <li id="userStatus"></li> <!-- 🔥 Afișăm statusul utilizatorului -->
                <li><button id="logoutButton" onclick="logout()" style="display: none;">Logout</button></li>
                <li><a href="register.html" id="loginButton" style="display: none;">Login</a></li>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Please fill out the form below, and we'll get back to you as soon as
                possible.</p>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 AI Learning & Photography. All rights reserved.</p>
    </footer>
    
    <script src="js/footer.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
