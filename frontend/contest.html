<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contests - AI Learning & Photography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <nav>
      <ul class="navbar">
        <li id="userStatus"></li>
        <li><button id="logoutButton" onclick="logout()" style="display: none;">Logout</button></li>
        <li><a href="register.html" id="loginButton" style="display: none;">Login</a></li>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="contest.html" class="active">Contests</a></li>
      </ul>
    </nav>
  </header>

  <main class="container my-5">
    <div class="hero">
      <h1>🏆 Available Contests</h1>
      <p>Showcase your creativity and compete with others in exciting challenges!</p>
    </div>
    <div id="contestList" class="contest-grid"></div>
  </main>

  <style>
    /* Contest-specific styles that integrate with the main CSS */
    .contest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .contest-card {
      background: linear-gradient(to bottom, #ffffff, #d9b0ec);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(160, 146, 211, 0.2);
    }

    .contest-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .contest-card h5 {
      color: #a092d3;
      font-size: 1.4rem;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .contest-card .card-info {
      color: #555;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .contest-card .card-info strong {
      color: #a092d3;
    }

    .contest-file-input {
      margin: 1rem 0;
      padding: 0.5rem;
      border: 2px dashed #a092d3;
      border-radius: 8px;
      background-color: rgba(160, 146, 211, 0.05);
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    .contest-file-input:hover {
      border-color: #ab68e2;
      background-color: rgba(160, 146, 211, 0.1);
    }

    .contest-submit-btn {
      background: linear-gradient(90deg, #b88dcc, #ab68e2);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
    }

    .contest-submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(171, 104, 226, 0.4);
    }

    .no-contests {
      text-align: center;
      color: #a092d3;
      font-size: 1.2rem;
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .error-message {
      text-align: center;
      color: #d63384;
      font-size: 1.2rem;
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-left: 4px solid #d63384;
    }

    /* Ensure user status styling matches */
    #userStatus {
      color: white;
      font-weight: bold;
      padding: 0.5rem 1rem;
    }
  </style>

  <script>
    function logout() {
      localStorage.removeItem("user_id");
      localStorage.removeItem("token");
      localStorage.removeItem("age");
      localStorage.removeItem("userId");
      window.location.href = "index.html";
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const userId = localStorage.getItem("user_id") || localStorage.getItem("userId");
      const userStatus = document.getElementById("userStatus");
      const loginBtn = document.getElementById("loginButton");
      const logoutBtn = document.getElementById("logoutButton");

      if (userId) {
        userStatus.innerHTML = `👤 Logged in as User #${userId}`;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
      } else {
        userStatus.innerHTML = "❌ Not Logged In";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        alert("You must be logged in to see contests.");
        window.location.href = "login.html";
        return;
      }

      try {
        const response = await fetch(`http://localhost:5000/api/contest/available/${userId}`);
        const contests = await response.json();

        if (!Array.isArray(contests) || contests.length === 0) {
          document.getElementById("contestList").innerHTML = '<div class="no-contests">🎯 No contests available for your group at the moment.<br>Check back soon for exciting new challenges!</div>';
          return;
        }

        let content = "";
        contests.forEach(contest => {
          content += `
          <div class="contest-card">
            <h5>${contest.title}</h5>
            <div class="card-info">📂 <strong>Category:</strong> ${contest.category}</div>
            <div class="card-info">👥 <strong>Age Group:</strong> ${contest.age_group}</div>
            <div class="card-info">📅 <strong>Deadline:</strong> ${new Date(contest.deadline).toLocaleDateString()}</div>
            <input type="file" id="file-${contest.id}" class="form-control contest-file-input" accept="image/*,video/*,.pdf,.doc,.docx">
            <button class="contest-submit-btn" onclick="submitEntry(${contest.id})">🚀 Submit Entry</button>
          </div>
        `;
        });

        document.getElementById("contestList").innerHTML = content;
      } catch (error) {
        console.error("Error fetching contests:", error);
        document.getElementById("contestList").innerHTML = '<div class="error-message">⚠️ Error loading contests. Please try again later.</div>';
      }
    });

    async function submitEntry(contestId) {
      const userId = localStorage.getItem("user_id") || localStorage.getItem("userId");
      const fileInput = document.getElementById(`file-${contestId}`);

      if (!fileInput.files.length) {
        alert("Please select a file to upload.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("user_id", userId);
      formData.append("contest_id", contestId);

      try {
        const response = await fetch("http://localhost:5000/api/contest/submit", {
          method: "POST",
          body: formData
        });

        const result = await response.json();
        if (response.ok) {
          alert("🎉 " + result.message);
          fileInput.value = "";
        } else {
          alert("❌ Error: " + (result.error || "Unknown error"));
        }
      } catch (error) {
        console.error("Submission error:", error);
        alert("❌ Submission failed. Please try again.");
      }
    }
  </script>

</body>

</html>
