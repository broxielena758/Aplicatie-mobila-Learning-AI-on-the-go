<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contests - AI Learning & Photography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
  <style>
    header {
      background: linear-gradient(90deg, #48c774, #40b484);
      color: white;
      padding: 1rem 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .navbar {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding-left: 0;
      margin: 0;
    }
    .navbar li {
      display: inline;
    }
    .navbar li a,
    .navbar li button {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
    }
    .navbar li a.active {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <ul class="navbar">
      <li id="userStatus"></li>
      <li><button id="logoutButton" onclick="logout()" style="display: none;">Logout</button></li>
      <li><a href="register.html" id="loginButton" style="display: none;">Login</a></li>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="contest.html" class="active">Contests</a></li>
    </ul>
  </nav>
</header>

<main class="container my-5">
  <h1 class="text-success mb-4">🏆 Available Contests</h1>
  <div id="contestList" class="row row-cols-1 row-cols-md-2 g-4"></div>
</main>

<script>
  function logout() {
    localStorage.removeItem("user_id");
    localStorage.removeItem("token");
    localStorage.removeItem("age");
    localStorage.removeItem("userId");
    window.location.href = "index.html";
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const userId = localStorage.getItem("user_id") || localStorage.getItem("userId");
    const userStatus = document.getElementById("userStatus");
    const loginBtn = document.getElementById("loginButton");
    const logoutBtn = document.getElementById("logoutButton");

    if (userId) {
      userStatus.innerHTML = `👤 Logged in as User #${userId}`;
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
    } else {
      userStatus.innerHTML = "❌ Not Logged In";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      alert("You must be logged in to see contests.");
      window.location.href = "login.html";
      return;
    }

    try {
      const response = await fetch(`http://localhost:5000/api/contest/available/${userId}`);
      const contests = await response.json();

      if (!Array.isArray(contests) || contests.length === 0) {
        document.getElementById("contestList").innerHTML = "<p>No contests available for your group.</p>";
        return;
      }

      let content = "";
      contests.forEach(contest => {
        content += `
          <div class="col">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${contest.title}</h5>
                <p class="card-text">📂 Category: ${contest.category}</p>
                <p class="card-text">👥 Age Group: ${contest.age_group}</p>
                <p class="card-text">📅 Deadline: ${new Date(contest.deadline).toLocaleDateString()}</p>
                <input type="file" id="file-${contest.id}" class="form-control mb-2">
                <button class="btn btn-primary w-100" onclick="submitEntry(${contest.id})">Submit Entry</button>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById("contestList").innerHTML = content;
    } catch (error) {
      console.error("Error fetching contests:", error);
      document.getElementById("contestList").innerHTML = "<p class='text-danger'>Error loading contests.</p>";
    }
  });

  async function submitEntry(contestId) {
    const userId = localStorage.getItem("user_id") || localStorage.getItem("userId");
    const fileInput = document.getElementById(`file-${contestId}`);

    if (!fileInput.files.length) {
      alert("Please select a file to upload.");
      return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("user_id", userId);
    formData.append("contest_id", contestId);

    try {
      const response = await fetch("http://localhost:5000/api/contest/submit", {
        method: "POST",
        body: formData
      });

      const result = await response.json();
      if (response.ok) {
        alert(result.message);
        fileInput.value = "";
      } else {
        alert("❌ Error: " + (result.error || "Unknown error"));
      }
    } catch (error) {
      console.error("Submission error:", error);
      alert("❌ Submission failed.");
    }
  }
</script>

</body>
</html>
